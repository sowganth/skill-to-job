# ===================================================================
# Student Skill-to-Job Finder System - Application Configuration
# ===================================================================

server.port=${PORT:8080}

# Database Connection (MySQL)
# Configured with environment variables for security and deployment flexibility
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/student_skill_job_finder?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
# Development uses 'update' (safe schema extension, no destructive drop)
# Production should use 'validate' or migration scripts (e.g. Flyway/Liquibase)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Security & JWT Configuration
# In production, set JWT_SECRET to a strong 256-bit base64/hex key
app.security.jwt.secret=${JWT_SECRET:Skill2JobSuperSecretKeyForCollegeProjectMustBeAtLeast256BitsLong2026!}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Initial Admin Credentials (Configurable via environment variables)
app.admin.email=${ADMIN_EMAIL:admin@skill2job.edu}
app.admin.password=${ADMIN_PASSWORD:Admin@Skill2Job2026!}
app.admin.name=${ADMIN_NAME:System Administrator}

# CORS Allowed Origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://127.0.0.1:3000}
