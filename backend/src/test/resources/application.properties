# Test Configuration using H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.security.jwt.secret=Skill2JobSuperSecretKeyForCollegeProjectMustBeAtLeast256BitsLong2026!
app.security.jwt.expiration-ms=86400000
app.admin.email=admin@test.edu
app.admin.password=AdminTestPass123!
app.admin.name=Test Administrator
app.cors.allowed-origins=http://localhost:5500
